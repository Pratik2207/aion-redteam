[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aion-redteam"
version = "0.1.0"
description = "OWASP-aligned adversarial red-team harness for LangGraph, CrewAI, and MCP agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cypharia" }]
keywords = [
    "security",
    "red-team",
    "owasp",
    "agentic",
    "llm",
    "langgraph",
    "ai-security",
    "prompt-injection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "structlog>=24.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
ollama = ["langchain-ollama>=0.2"]
crewai = ["crewai>=0.80"]
mcp = ["mcp>=1.0"]
llm-judge = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/Cypharia/aion-redteam"
Repository = "https://github.com/Cypharia/aion-redteam"
Issues = "https://github.com/Cypharia/aion-redteam/issues"

[project.scripts]
aion-redteam = "aion_redteam.cli.main:app"

[tool.hatch.build.targets.wheel]
# scenarios/ and policies/ live inside the package, so their YAML data ships
# automatically — no force-include needed.
packages = ["src/aion_redteam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/aion_redteam/core"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# report.py embeds an HTML/CSS template string with long style lines.
"src/aion_redteam/core/report.py" = ["E501"]
# Typer requires typer.Option/Argument calls in parameter defaults (B008).
"src/aion_redteam/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/aion_redteam"]
